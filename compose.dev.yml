# Development environment: all three applications with hot reloading plus
# PostgreSQL and Redis for local development tools.
#
# Compose variable interpolation values come from an explicit env file
# (copy .env.docker.example to .env.docker and adjust):
#   docker compose --env-file .env.docker -f compose.dev.yml up --build
#
# Application-internal configuration is injected via `env_file` (the apps'
# own env files), not duplicated here. Only values that must differ from the
# local files — container-to-container hostnames — are set under `environment`
# (compose `environment` takes precedence over `env_file`).

name: neo-bank-dev

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    env_file:
      - apps/api/env/.env.development
    environment:
      # Containers reach each other by service name, never localhost. The
      # Redis credentials come from .env.docker so the container topology is
      # independent of host-local values in the app env file (compose
      # `environment` takes precedence over `env_file`).
      REDIS_URL: redis://redis:6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env.docker}
    volumes:
      # Source bind mount for hot reloading; the named volumes keep the
      # container-installed node_modules from being shadowed by the host's.
      - .:/repo
      - root_node_modules:/repo/node_modules
      - api_node_modules:/repo/apps/api/node_modules
      - web_node_modules:/repo/apps/web/node_modules
      - admin_node_modules:/repo/apps/admin/node_modules
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    volumes:
      - .:/repo
      - root_node_modules:/repo/node_modules
      - api_node_modules:/repo/apps/api/node_modules
      - web_node_modules:/repo/apps/web/node_modules
      - admin_node_modules:/repo/apps/admin/node_modules
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.dev
    # Vite must listen on all interfaces inside the container.
    # Vite must listen on all interfaces inside the container; pnpm forwards
    # unrecognized flags to the script (a literal `--` would be passed through
    # and Vite would stop flag parsing at it).
    command: ['pnpm', 'dev', '--host', '0.0.0.0']
    volumes:
      - .:/repo
      - root_node_modules:/repo/node_modules
      - api_node_modules:/repo/apps/api/node_modules
      - web_node_modules:/repo/apps/web/node_modules
      - admin_node_modules:/repo/apps/admin/node_modules
    ports:
      - '${ADMIN_PORT:-5173}:5173'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neo_bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-neo_bank}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2-alpine
    # Data is intentionally ephemeral: no persistence, no volume, no AOF.
    # Authentication is enabled in every environment so dev matches prod.
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env.docker}',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env.docker}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
  root_node_modules:
  api_node_modules:
  web_node_modules:
  admin_node_modules:
