packages:
  - apps/*
minimumReleaseAgeExclude:
  - '@next/env@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - next@16.4.3
  - '@nestjs/mapped-types@12.0.1'
  - '@nestjs/swagger@12.1.0'
allowBuilds:
  '@swc/core': true
  # NestJS telemetry collector: its postinstall must never run — denied
  # explicitly so non-interactive installs (Docker, CI) do not fail with
  # ERR_PNPM_IGNORED_BUILDS.
  '@scarf/scarf': false
