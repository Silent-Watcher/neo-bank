# Development environment: all three applications with hot reloading plus
# PostgreSQL, Redis, and MockServer for local development tools.
#
# Compose variable interpolation values come from an explicit env file
# (copy docker/env/.env.docker.example to docker/env/.env.docker.dev and adjust):
#   docker compose --env-file docker/env/.env.docker.dev -f docker/compose.app.dev.yml up --build
#
# Application-internal configuration is injected via `env_file` (the apps'
# own env files), not duplicated here. Only values that must differ from the
# local files — container-to-container hostnames — are set under `environment`
# (compose `environment` takes precedence over `env_file`).

name: neo-bank-dev

# Keep host-side json-file logs bounded: rotated per container instead of
# growing without limit. Applies to every service in this file.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile.dev
    env_file:
      - ../apps/api/env/.env.development
    environment:
      # Containers reach each other by service name, never localhost. The
      # Redis credentials come from docker/env/.env.docker.dev so the container topology is
      # independent of host-local values in the app env file (compose
      # `environment` takes precedence over `env_file`).
      REDIS_URL: redis://redis:6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in docker/env/.env.docker.dev}
      # PostgreSQL connection URL (ADR-027): the container reaches the
      # database by service name on the container port; credentials come
      # from docker/env/.env.docker.dev (compose `environment` takes
      # precedence over the host-local DATABASE_URL in the app env file).
      DATABASE_URL: postgresql://${POSTGRES_USER:-neo_bank}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in docker/env/.env.docker.dev}@postgres:5432/${POSTGRES_DB:-neo_bank}
      # Host-accessible Redis Insight URL (ADR-020), logged at API startup.
      # Set only here: the API never advertises an address it cannot know
      # exists, so local non-Docker development and production log nothing.
      REDIS_INSIGHT_URL: http://localhost:${REDIS_INSIGHT_PORT:-8001}
      # MockServer addresses (ADR-024), logged at API startup in development:
      # the host URL for developers on the machine, the Docker URL for
      # containers. Set only here — local non-Docker development and
      # production log neither address.
      MOCKSERVER_HOST_URL: http://localhost:${MOCKSERVER_PORT:-1080}
      MOCKSERVER_DOCKER_URL: http://mockserver:1080
      # Structured JSON in the container even though APP_ENV=development:
      # the centralized logging pipeline (compose.monitoring.yml) collects
      # and parses these logs. Host-side development keeps pino-pretty.
      LOG_PRETTY: 'false'
    volumes:
      # Source bind mount for hot reloading; the named volumes keep the
      # container-installed node_modules from being shadowed by the host's.
      - ..:/repo
      - root_node_modules:/repo/node_modules
      - api_node_modules:/repo/apps/api/node_modules
      - web_node_modules:/repo/apps/web/node_modules
      - admin_node_modules:/repo/apps/admin/node_modules
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile.dev
    volumes:
      - ..:/repo
      - root_node_modules:/repo/node_modules
      - api_node_modules:/repo/apps/api/node_modules
      - web_node_modules:/repo/apps/web/node_modules
      - admin_node_modules:/repo/apps/admin/node_modules
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile.dev
    # Vite must listen on all interfaces inside the container.
    # Vite must listen on all interfaces inside the container; pnpm forwards
    # unrecognized flags to the script (a literal `--` would be passed through
    # and Vite would stop flag parsing at it).
    command: ['pnpm', 'dev', '--host', '0.0.0.0']
    volumes:
      - ..:/repo
      - root_node_modules:/repo/node_modules
      - api_node_modules:/repo/apps/api/node_modules
      - web_node_modules:/repo/apps/web/node_modules
      - admin_node_modules:/repo/apps/admin/node_modules
    ports:
      - '${ADMIN_PORT:-5173}:5173'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neo_bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in docker/env/.env.docker.dev}
      POSTGRES_DB: ${POSTGRES_DB:-neo_bank}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      # Bound to loopback (SEC-03, Wave 14): dev infrastructure must not be
      # reachable from LAN peers; host-local tools connect through 127.0.0.1,
      # containers use the internal network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    # Version-pinned (was :latest): 7.4.0-v8 bundles Redis server 7.4.7 —
    # the exact build the stack ran before the pin, verified by digest.
    image: redis/redis-stack:7.4.0-v8
    # Data is intentionally ephemeral: no persistence, no volume, no AOF.
    # Authentication is enabled in every environment so dev matches prod.
    # The Stack entrypoint starts redis-server plus the bundled modules and
    # Redis Insight; server args are passed through REDIS_ARGS (ADR-020).
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in docker/env/.env.docker.dev}
      REDIS_ARGS: >-
        --save ''
        --appendonly no
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in docker/env/.env.docker.dev}
    ports:
      # Bound to loopback (SEC-03, Wave 14): same rationale as the postgres
      # port — dev infrastructure stays off the LAN; containers use the
      # internal network.
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
      # Redis Insight, bundled in the Stack image (ADR-020): development only.
      - '127.0.0.1:${REDIS_INSIGHT_PORT:-8001}:8001'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # MockServer (ADR-024): development-only HTTP mock for resilience testing.
  # Simulates downstream service behavior — timeouts, 5xx responses, delays,
  # failure-then-recovery sequences — so the API's resilience patterns can be
  # exercised repeatably. Expectations are ephemeral (no volume): every
  # container restart starts from a clean state. The image is distroless (no
  # shell, no curl/wget) and ships a built-in HEALTHCHECK probing
  # PUT /mockserver/status, so no healthcheck override is defined here.
  # Nothing depends on this service: the API only logs its address.
  mockserver:
    image: mockserver/mockserver:9.2.0
    ports:
      # Control API, mocked endpoints, and dashboard all on one port. Bound
      # to loopback explicitly: the control API is unauthenticated and can
      # forward requests to arbitrary targets, so it must never be reachable
      # from other network peers (containers use the internal network).
      - '127.0.0.1:${MOCKSERVER_PORT:-1080}:1080'
    logging: *default-logging

volumes:
  postgres_dev_data:
  root_node_modules:
  api_node_modules:
  web_node_modules:
  admin_node_modules:
